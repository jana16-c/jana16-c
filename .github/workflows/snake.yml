name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: jana16-c
          github_token: ${{ secrets.SNAKE_GITHUB_TOKEN || github.token }}
          outputs: |
            dist/github-snake.svg?palette=github&color_snake=#8bbcf6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#8bbcf6

      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
